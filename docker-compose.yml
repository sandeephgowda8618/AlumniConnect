version: '3.8'

services:
  # 1. Authoritative MySQL 8.x Relational Database
  mysql:
    image: mysql:8.0
    container_name: alumniconnect_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassSecure2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alumniconnect}
      MYSQL_USER: ${MYSQL_USER:-alumni_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-AlumniAppPass2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/app/db/views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./backend/app/db/procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./backend/app/db/triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-alumni_app}", "-p${MYSQL_PASSWORD:-AlumniAppPass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Supporting Redis Cache & Lock Store
  redis:
    image: redis:7-alpine
    container_name: alumniconnect_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisSecurePass2026!}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Supporting Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: alumniconnect_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-Neo4jSecurePass2026!}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 4. FastAPI Backend Modular Monolith
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alumniconnect_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-alumni_app}:${MYSQL_PASSWORD:-AlumniAppPass2026!}@mysql:3306/${MYSQL_DATABASE:-alumniconnect}?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecurePass2026!}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-Neo4jSecurePass2026!}
      SECRET_KEY: ${SECRET_KEY:-alumniconnect-secret-key-production-grade-random-string-2026}
    ports:
      - "8000:8000"

  # 5. Background Transactional Outbox Worker
  outbox_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alumniconnect_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox_worker"]
    depends_on:
      backend:
        condition: service_started
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-alumni_app}:${MYSQL_PASSWORD:-AlumniAppPass2026!}@mysql:3306/${MYSQL_DATABASE:-alumniconnect}?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecurePass2026!}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-Neo4jSecurePass2026!}

  # 6. Next.js Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alumniconnect_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  redis_data:
  neo4j_data:

